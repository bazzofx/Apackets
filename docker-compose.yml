# ShadowPackets — local PCAP/PCAPNG analysis, in one container.
#
#   docker compose up --build
#   open http://127.0.0.1:8080
#
# The container serves the interface *and* the API on one port; nothing else is
# published, and the port is bound to loopback so the capture data never leaves this
# machine. All state — uploads, the SQLite index, extracted objects, the GeoIP
# dataset — lives in the named volume `shadowpackets-data`.
#
# Configuration: copy .env.example to .env and edit. Every SHADOWPACKETS_* value below has
# a default, so an empty .env is a working installation.

name: shadowpackets

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: shadowpackets:0.1.0
    container_name: shadowpackets
    restart: unless-stopped

    environment:
      # Inside the container the server must listen on all interfaces; the *published*
      # mapping below is what keeps it on loopback.
      SHADOWPACKETS_DATA_DIR: /data
      SHADOWPACKETS_HOST: 0.0.0.0
      SHADOWPACKETS_PORT: "8000"
      # The URL printed at startup is the host URL, not the container's port 8000.
      SHADOWPACKETS_PUBLIC_URL: "http://127.0.0.1:${SHADOWPACKETS_PORT_HOST:-8080}"
      SHADOWPACKETS_MAX_UPLOAD_MB: "${SHADOWPACKETS_MAX_UPLOAD_MB:-512}"
      SHADOWPACKETS_TSHARK_TIMEOUT_S: "${SHADOWPACKETS_TSHARK_TIMEOUT_S:-300}"
      SHADOWPACKETS_MAX_OBJECT_BYTES: "${SHADOWPACKETS_MAX_OBJECT_BYTES:-52428800}"
      SHADOWPACKETS_BODY_PREVIEW_BYTES: "${SHADOWPACKETS_BODY_PREVIEW_BYTES:-262144}"
      SHADOWPACKETS_MAX_EXPORT_ROWS: "${SHADOWPACKETS_MAX_EXPORT_ROWS:-200000}"
      SHADOWPACKETS_WORKER_THREADS: "${SHADOWPACKETS_WORKER_THREADS:-2}"
      SHADOWPACKETS_RETAIN_UPLOADS: "${SHADOWPACKETS_RETAIN_UPLOADS:-true}"
      SHADOWPACKETS_BASELINE_AUTO_RECALC: "${SHADOWPACKETS_BASELINE_AUTO_RECALC:-true}"
      SHADOWPACKETS_SURICATA_AUTO_SEED: "${SHADOWPACKETS_SURICATA_AUTO_SEED:-true}"
      SHADOWPACKETS_LOG_LEVEL: "${SHADOWPACKETS_LOG_LEVEL:-INFO}"

    # Loopback only. The interface and the API share this one port.
    ports:
      - "127.0.0.1:${SHADOWPACKETS_PORT_HOST:-8080}:8000"

    volumes:
      - shadowpackets-data:/data
      # Or keep the captures in a directory you can see from the host:
      # - ${SHADOWPACKETS_DATA_HOST:-./data}:/data

    # A hostile capture cannot exhaust the host.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 512

    # Give the pipeline a moment to finish writing before the container is killed.
    stop_grace_period: 30s

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status==200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  shadowpackets-data:
    name: shadowpackets-data
