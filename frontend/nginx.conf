# nginx configuration for the ShadowPackets frontend container.
#
# Serves the built single-page app and proxies the API to the backend service.
# The container is only published on loopback by docker-compose, so this never
# exposes capture data beyond the host.

upstream shadowpackets_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PCAP uploads can be large; keep in step with SHADOWPACKETS_MAX_UPLOAD_MB.
    client_max_body_size 1024m;
    client_body_timeout 600s;

    # Never let a browser sniff a type for extracted-object downloads.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames may be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://shadowpackets_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long uploads and CSV exports must not be cut off mid-transfer.
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # Client-side routing: unknown paths fall through to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
