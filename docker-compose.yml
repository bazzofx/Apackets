# ShinboShark — local PCAP/PCAPNG analysis, in one container.
#
#   docker compose up --build
#   open http://127.0.0.1:8080
#
# The container serves the interface *and* the API on one port; nothing else is
# published, and the port is bound to loopback so the capture data never leaves this
# machine. All state — uploads, the SQLite index, extracted objects, the GeoIP
# dataset — lives in the named volume `shinobishark-data`.
#
# Configuration: copy .env.example to .env and edit. Every APACKETS_* value below has
# a default, so an empty .env is a working installation.

name: shinobishark

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: shinobishark:0.1.0
    container_name: shinobishark
    restart: unless-stopped

    environment:
      # Inside the container the server must listen on all interfaces; the *published*
      # mapping below is what keeps it on loopback.
      APACKETS_DATA_DIR: /data
      APACKETS_HOST: 0.0.0.0
      APACKETS_PORT: "8000"
      APACKETS_MAX_UPLOAD_MB: "${APACKETS_MAX_UPLOAD_MB:-512}"
      APACKETS_TSHARK_TIMEOUT_S: "${APACKETS_TSHARK_TIMEOUT_S:-300}"
      APACKETS_MAX_OBJECT_BYTES: "${APACKETS_MAX_OBJECT_BYTES:-52428800}"
      APACKETS_BODY_PREVIEW_BYTES: "${APACKETS_BODY_PREVIEW_BYTES:-262144}"
      APACKETS_MAX_EXPORT_ROWS: "${APACKETS_MAX_EXPORT_ROWS:-200000}"
      APACKETS_WORKER_THREADS: "${APACKETS_WORKER_THREADS:-2}"
      APACKETS_RETAIN_UPLOADS: "${APACKETS_RETAIN_UPLOADS:-true}"
      APACKETS_BASELINE_AUTO_RECALC: "${APACKETS_BASELINE_AUTO_RECALC:-true}"
      APACKETS_LOG_LEVEL: "${APACKETS_LOG_LEVEL:-INFO}"

    # Loopback only. The interface and the API share this one port.
    ports:
      - "127.0.0.1:${APACKETS_PORT_HOST:-8080}:8000"

    volumes:
      - shinobishark-data:/data
      # Or keep the captures in a directory you can see from the host:
      # - ${APACKETS_DATA_HOST:-./data}:/data

    # A hostile capture cannot exhaust the host.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 512

    # Give the pipeline a moment to finish writing before the container is killed.
    stop_grace_period: 30s

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status==200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  shinobishark-data:
    name: shinobishark-data
