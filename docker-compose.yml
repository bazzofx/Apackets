# APackets — local PCAP/PCAPNG analysis stack.
#
# Everything binds to loopback by default. Uploaded captures and all derived
# data stay in the named volume / bind mount on this machine; no service in this
# file makes any outbound connection.
#
#   docker compose up --build
#   open http://127.0.0.1:8080
#
# Configuration: copy .env.example to .env and edit. Values are passed to the
# backend through the `environment:` block below.

name: apackets

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: apackets-backend:0.1.0
    container_name: apackets-backend
    restart: unless-stopped

    environment:
      APACKETS_DATA_DIR: /data
      APACKETS_HOST: 0.0.0.0
      APACKETS_PORT: "8000"
      APACKETS_MAX_UPLOAD_MB: "${APACKETS_MAX_UPLOAD_MB:-512}"
      APACKETS_TSHARK_TIMEOUT_S: "${APACKETS_TSHARK_TIMEOUT_S:-300}"
      APACKETS_MAX_OBJECT_BYTES: "${APACKETS_MAX_OBJECT_BYTES:-52428800}"
      APACKETS_BODY_PREVIEW_BYTES: "${APACKETS_BODY_PREVIEW_BYTES:-262144}"
      APACKETS_WORKER_THREADS: "${APACKETS_WORKER_THREADS:-2}"
      APACKETS_RETAIN_UPLOADS: "${APACKETS_RETAIN_UPLOADS:-true}"
      APACKETS_LOG_LEVEL: "${APACKETS_LOG_LEVEL:-INFO}"

    # Only reachable from the host. Change to "127.0.0.1:8000:8000" to expose
    # the API directly as well as through the frontend.
    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      # Named volume keeps analysis metadata and uploads between runs.
      - apackets-data:/data
      # Bind-mount alternative: set APACKETS_DATA_HOST in .env to a local
      # directory to keep captures somewhere you control.
      # - ${APACKETS_DATA_HOST:-./data}:/data

    # Defensive limits: a hostile capture cannot exhaust the host.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 512

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status==200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    networks:
      - apackets

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: apackets-frontend:0.1.0
    container_name: apackets-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "127.0.0.1:8080:80"

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # nginx needs these two to bind its worker processes, nothing more.
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    mem_limit: 512m

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

    networks:
      - apackets

volumes:
  apackets-data:
    name: apackets-data

networks:
  apackets:
    driver: bridge
